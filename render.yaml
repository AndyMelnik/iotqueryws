services:
  - type: static_site
    name: iotqueryws
    runtime: static
    buildCommand: npm ci && npm run build
    publishPath: out
    pullRequestPreviewsEnabled: true
# Render Blueprint — deploy as Static Site (recommended for this app)
# https://docs.render.com/static-sites
services:
  - type: web
    name: iot-query-website
    runtime: static
    region: oregon

    buildCommand: npm install && npm run build
    staticPublishPath: out
